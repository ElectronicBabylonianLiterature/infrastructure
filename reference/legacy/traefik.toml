# HISTORICAL TRAEFIK 1.7 REFERENCE (not the production Traefik 3 configuration).
# Retained while the stopped legacy ingress is available for controlled rollback.
# Do not use it to generate or replace the current VM/Swarmpit-managed proxy.
constraints = ["tag==traefik-public"]
logLevel = "INFO"
defaultEntryPoints = ["http", "https"]


[accessLog]

[entryPoints]
  [entryPoints.http]
  address = ":80"
    [entryPoints.http.redirect]
    entryPoint = "https"
  [entryPoints.https]
  address = ":443"
  compress = true
    [entryPoints.https.redirect]
      regex = "/fragmentarium(.*)"
      replacement = "/library$1"
    [entryPoints.https.tls]
    minVersion = "VersionTLS12"
      

[acme]
email = "fabian.simonjetz@caic.badw.de"
storage = "traefik/acme/account"
entryPoint = "https"
acmeLogging = true
onHostRule = true

[acme.httpChallenge]
entryPoint = "http"

[[acme.domains]]
  main = "www.ebl.badw.de"
  sans = ["ebl.badw.de"]

[[acme.domains]]
  main = "www.ebl.lmu.de"
  sans = ["www.ebl.uni-muenchen.de"]


[docker]
watch = true
swarmMode = true
exposedByDefault = false


[consul]
endpoint = "consul-leader:8500"


[api]
  dashboard = true

[metrics]
  [metrics.prometheus]
